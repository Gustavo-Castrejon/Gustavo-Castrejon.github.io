<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
        (function () {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- Shared theme variables -->
    <link rel="stylesheet" href="css/theme.css">

    <!-- Global unified navbar CSS -->
    <link rel="stylesheet" href="css/navbar.css">

    <!-- Global styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="css/contact.css">
    <title>Contact - Gustavo Castrejon</title>
</head>

<body>

    <!-- Unified Global Navbar -->
    <header class="transparent">
        <div class="logo">
            <h1>Gustavo Castrejon</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light and dark theme" type="button">
                <span class="theme-toggle-icon"></span>
            </button>
        </nav>
    </header>

    <!-- Main Content -->

        <section class="contact-section">

                </div>
                <div class="contact-item">
                    <span class="contact-icon">&#x1F4DE;</span>
                    <a href="tel:+18183071246">(818) 307-1246</a>
                </div>
                <div class="contact-item linkedin-item">
                    <div class="linkedin-logo-container">
                        <img src="assets/images/logos/linkedin.png" alt="LinkedIn Logo" class="linkedin-logo">
                    </div>
                    <a href="https://www.linkedin.com/in/gustavo-castrejon-87b884251" target="_blank">Gustavo Castrejon</a>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">&#x1F4BB;</span>
                    <a href="https://gustavo-castrejon.github.io/" target="_blank">gustavo-castrejon.github.io</a>

        <p>&copy; 2026 Gustavo Castrejon</p>
        <a href="https://www.linkedin.com/in/gustavo-castrejon-87b884251" target="_blank" class="footer-linkedin">
            <img src="assets/images/logos/linkedin.png" alt="LinkedIn Logo" class="linkedin-logo-footer">
        </a>
    </footer>

    <!-- Unified Scroll Behavior -->
    <script src="js/navbar.js"></script>

</body>

</html>
